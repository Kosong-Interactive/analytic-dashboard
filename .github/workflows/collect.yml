name: Scheduled collection

on:
  schedule:
    # Once a day at 22:17 UTC (05:17 WIB), so the data is fresh before the team starts and the daily
    # research job (01:43 UTC) runs after it. Non-round minute; schedules are best-effort and may run late.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Limit to one source
        type: choice
        options: ["", app_store, google_play]
        default: ""
      country:
        description: Limit to one country
        type: choice
        options: ["", id, us, sg, th, vn, ph, my, jp, kr, gb, de, br, in]
        default: ""

permissions:
  contents: read

# Reruns are safe (idempotent writes), but two overlapping runs would only waste request budget.
concurrency:
  group: scheduled-collection
  cancel-in-progress: false

jobs:
  discover:
    name: Discover games
    runs-on: ubuntu-latest
    # Thirteen storefronts take about 30 minutes of discovery, then classification and Steam.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workspace packages such as collectors and shared are imported from dist/, so build them first.
      - name: Build collector dependencies
        run: npx turbo run build --filter=@analytic-dashboard/collector...

      # Non-zero exit when any job hit an error, so failures show up in the Actions UI.
      - name: Run discovery
        run: npm run discover --workspace @analytic-dashboard/collector -- ${SOURCE:+--source "$SOURCE"} ${COUNTRY:+--country "$COUNTRY"}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE: ${{ inputs.source }}
          COUNTRY: ${{ inputs.country }}

      # Runs even when discovery reported errors, so games that were stored still get labels.
      # Unchanged apps are skipped by input hash, so this is cheap after the first run; a backlog
      # (new storefronts, an interrupted run) can need several minutes, and progress is logged.
      - name: Classify games with rules
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: npm run classify --workspace @analytic-dashboard/collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # At most 200 changed apps per run (8 per request); the input-hash cache carries the rest to
      # later runs. Exits 0 when every model is out of free-tier quota or the key is not set.
      # A stalled connection fails this step instead of holding the job until its 45-minute limit.
      - name: Classify games with AI
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: npm run classify-ai --workspace @analytic-dashboard/collector -- --limit 200
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Steam Global charts (about 410 requests at 1 per second for 200 games, well under the
      # 100,000-call daily Web API limit). Skipped when a manual run targets one mobile store, and
      # exits 0 when STEAM_WEB_API_KEY is not set.
      - name: Discover Steam games
        if: ${{ !cancelled() && !inputs.source }}
        timeout-minutes: 20
        run: npm run discover-steam --workspace @analytic-dashboard/collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}

      - name: Classify Steam games with rules
        if: ${{ !cancelled() && !inputs.source }}
        timeout-minutes: 10
        run: npm run classify-steam --workspace @analytic-dashboard/collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # At most 200 changed Steam games per run; the input-hash cache carries the rest to later runs.
      # Only public Steam store text is sent. Exits 0 when every model is out of quota or no key is set.
      - name: Classify Steam games with AI
        if: ${{ !cancelled() && !inputs.source }}
        timeout-minutes: 15
        run: npm run classify-steam-ai --workspace @analytic-dashboard/collector -- --limit 200
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
